<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Smart Class Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2fe; --bg: #05070a; --surface: #12151c; --surface-light: #1e232d; --text-main: #e0e6ed; --text-dim: #94a3b8; --border: #2d3748; }
        body { margin: 0; font-family: 'Inter', 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: rgba(18, 21, 28, 0.9); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 600px; background: var(--surface); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .filter-panel { padding: 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .filter-panel select { background: #0f172a; color: white; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 0.75rem; outline: none; }
        .table-container { flex: 1; overflow-y: auto; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 550px; }
        th { background: #0f172a; color: var(--accent); padding: 12px 8px; position: sticky; top: 0; text-align: left; border-bottom: 1px solid var(--border); }
        td { padding: 10px 8px; border-bottom: 1px solid #1e293b; color: var(--text-dim); cursor: pointer; }
        tr:hover td { background: #1e232d; color: white; }
        .player-section { flex: 1; background: #000; display: flex; flex-direction: column; padding: 20px; align-items: center; }
        .video-wrapper { width: 100%; max-width: 900px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .playing-info { max-width: 900px; margin-top: 20px; width: 100%; }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: var(--surface); padding: 35px; border-radius: 15px; width: 300px; text-align: center; border: 1px solid var(--border); }
        .login-card input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <div class="logo" style="margin-bottom: 20px;">Smart Class Pro</div>
        <input type="text" id="username" placeholder="ইউজার নেম">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <button class="btn-login" onclick="handleLogin()">প্রবেশ করুন</button>
        <p id="loginMsg" style="color: #ef4444; font-size: 0.75rem;"></p>
    </div>
</div>

<header>
    <div class="logo">Smart Class Pro</div>
    <div id="userSection" style="display: none;">
        <button onclick="logout()" style="background:transparent; color:var(--text-dim); border:1px solid var(--border); padding:5px 12px; border-radius:15px; cursor:pointer;">লগআউট</button>
    </div>
</header>

<div class="app-container" id="appMain" style="display: none;">
    <div class="sidebar">
        <div class="filter-panel">
            <select id="classSel" onchange="filterData()"><option value="">শ্রেণী</option></select>
            <select id="subSel" onchange="filterData()"><option value="">বিষয়</option></select>
            <select id="lessonSel" onchange="filterData()"><option value="">অধ্যায়</option></select>
            <select id="schoolSel" onchange="filterData()"><option value="">স্কুল</option></select>
            <select id="yearSel" onchange="filterData()"><option value="">বছর</option></select>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>শ্রেণী</th>
                        <th>বিষয়</th>
                        <th>অধ্যায়</th>
                        <th>টপিক</th>
                        <th>স্কুল</th>
                        <th>বছর</th>
                    </tr>
                </thead>
                <tbody id="videoTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="player-section">
        <div class="video-wrapper" id="playerWrapper">
            <div style="color:var(--text-dim); display:flex; justify-content:center; align-items:center; height:100%">ভিডিও সিলেক্ট করুন</div>
        </div>
        <div class="playing-info">
            <h2 id="nowPlayingTitle" style="color:var(--accent)">শিখন শুরু হোক...</h2>
            <p id="nowPlayingMeta" style="color:var(--text-dim)"></p>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDLG8azvFSdrOs3H9NqCWkCQ983iK8n92P6Vp96oJspstWiTY6Z_qcGG7V9xJ9x2eyEg/exec';
    let db = [];

    window.onload = () => { if(localStorage.getItem('isLoggedIn') === 'true') initApp(); };

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(!u || !p) return;
        document.getElementById('loginMsg').innerText = "যাচাই করা হচ্ছে...";
        try {
            const res = await fetch(`${SCRIPT_URL}?type=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
            const data = await res.json();
            if(data.status === "success") {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user', data.username);
                initApp();
            } else { document.getElementById('loginMsg').innerText = "ভুল তথ্য!"; }
        } catch(e) { document.getElementById('loginMsg').innerText = "সার্ভার এরর!"; }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function initApp() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appMain').style.display = 'flex';
        document.getElementById('userSection').style.display = 'block';
        loadData();
    }

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            db = await res.json();
            ['class', 'sub', 'lesson', 'school', 'year'].forEach(key => fillSelect(key + 'Sel', key));
            filterData();
        } catch(e) { console.error("ডাটা লোড সমস্যা"); }
    }

    function fillSelect(eleId, key) {
        const select = document.getElementById(eleId);
        const uniqueValues = [...new Set(db.map(item => item[key]))].sort();
        uniqueValues.forEach(val => { if(val) select.add(new Option(val, val)); });
    }

    function filterData() {
        const f = {
            class: document.getElementById('classSel').value,
            sub: document.getElementById('subSel').value,
            lesson: document.getElementById('lessonSel').value,
            school: document.getElementById('schoolSel').value,
            year: document.getElementById('yearSel').value
        };

        const filtered = db.filter(i => 
            (!f.class || i.class == f.class) && 
            (!f.sub || i.sub == f.sub) &&
            (!f.lesson || i.lesson == f.lesson) &&
            (!f.school || i.school == f.school) &&
            (!f.year || i.year == f.year)
        );
        
        const body = document.getElementById('videoTableBody');
        body.innerHTML = "";
        filtered.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.class || ''}</td>
                <td>${item.sub || ''}</td>
                <td>${item.lesson || ''}</td>
                <td style="color:white">${item.topic || ''}</td>
                <td>${item.school || ''}</td>
                <td>${item.year || ''}</td>
            `;
            row.onclick = () => playVideo(item);
            body.appendChild(row);
        });
    }

    function getYoutubeID(url) {
        if(!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function playVideo(item) {
        const ytId = getYoutubeID(item.url);
        if(ytId) {
            // Error 153 ফিক্স করার জন্য অরিজিন ডিটেকশন এবং JS API এনাবল করা হয়েছে
            let currentOrigin = window.location.origin;
            if (currentOrigin === "null" || currentOrigin.startsWith("file://")) {
                currentOrigin = "*"; // লোকাল ফাইলের জন্য ওয়াইল্ডকার্ড ব্যবহার
            }

            document.getElementById('playerWrapper').innerHTML = `
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen 
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>`;
            
            document.getElementById('nowPlayingTitle').innerText = item.topic;
            document.getElementById('nowPlayingMeta').innerText = `${item.school || ''} | ${item.class || ''} | ${item.sub || ''} | ${item.lesson || ''}`;
        } else {
            alert("সঠিক ভিডিও লিংক পাওয়া যায়নি!");
        }
    }
</script>
</body>
</html>

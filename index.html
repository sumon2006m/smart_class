<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Class Pro | Dashboard</title>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"> -->
     <link href="https://fonts.googleapis.com/css2?family=Freehand&family=Noto+Sans+Bengali:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #00f2fe; 
            --bg: #05070a; 
            --surface: #0f1219; 
            --text-main: #e0e6ed; 
            --text-dim: #94a3b8; 
            --border: #2d3748; 
            --header-height: 60px;
            --player-height-mobile: 280px;
            /* Safe Area ইনসেটগুলো ভেরিয়েবল হিসেবে সেট করা */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            /* --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px); */
        }
        
        body { 
            margin: 0; 
            /* font-family: 'Inter', 'Hind Siliguri', sans-serif;  */
            font-family: 'Poppins', 'Noto Sans Bengali', sans-serif;
            background: var(--bg); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            /* পুরো বডিকে সেফ এরিয়ার ভেতরে রাখার জন্য */
            /* padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right); */
        }

        /* লোডিং বার - এটি না থাকলে ৪০তম ডাটা রেন্ডার হতে এরর দেয় */
        #loadingBar {
            height: 2px;
            width: 0%;
            background: var(--accent);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10001;
            transition: width 0.3s;
        }

        header { 

            height: var(--header-height);
            background: rgba(15, 18, 25, 0.95); 
            padding: 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            z-index: 1000;
            padding-top: var(--safe-top);


            /* height: calc(var(--header-height) + var(--safe-top)); */
            /* background: rgba(15, 18, 25, 0.95);  */
            /* padding: 0 20px;  */
            /* display: flex;  */
            /* justify-content: space-between;  */
            /* align-items: center;  */
            /* border-bottom: 1px solid var(--border);  */
            z-index: 1000;
            /* flex-shrink: 0; */
            padding-top: var(--safe-top);
        }

        .logo { font-size: 1.2rem; font-weight: 800; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .app-container { display: flex; flex: 1; overflow: hidden; }

        /* সাইডবার (ডেস্কটপ) */
        .sidebar { 
            width: 45%; 
            min-width: 450px; 
            background: var(--surface); 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid var(--border);
            overflow: hidden; 
        }
        
        .filter-panel { 
            padding: 10px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            background: #141923; 
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .filter-panel select { 
            background: #1a1f2e; color: white; border: 1px solid var(--border); 
            padding: 7px; border-radius: 6px; font-size: 0.75rem;
            outline: none; 
            /* cursor: pointer; */
            /* width: 100%;  */
        }

        .table-container { 
            flex: 1; 
            overflow: auto; 
            background: var(--surface);
            position: relative;
            /* padding-bottom: var(--player-height-mobile); */
            -webkit-overflow-scrolling: touch;
        }
        
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            min-width: 700px;
        }
        
        th { 
            background: #161b26; 
            color: var(--accent); 
            padding: 12px 10px; 
            position: sticky; 
            top: 0; 
            z-index: 20; 
            text-align: left; 
            border-bottom: 2px solid var(--border); 
            font-size: 0.75rem; 
            /* white-space: nowrap; */
        }
        
        td { 
            padding: 10px; 
            border-bottom: 1px solid #1e293b; 
            color: var(--text-dim); 
            cursor: pointer; 
            font-size: 0.8rem; 
            /* white-space: nowrap;  */
        }
        
        .topic-cell { white-space: normal; min-width: 180px; color: #fff; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        tr.active-row td { background: rgba(0, 242, 254, 0.1) !important; color: var(--accent) !important; }

        /* প্লেয়ার সেকশন */
        .player-section { flex: 1; background: #000; display: flex; flex-direction: column; overflow: hidden; }
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; }
        
        .playing-info { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(15, 18, 25, 0) 0%, rgba(0, 0, 0, 0.4) 100%);
            /* height: 30px; */
        }

        .playing-info h2 { 
            font-size: 0.95rem; /* সামান্য বাড়ানো হয়েছে পড়ার সুবিধার জন্য */
            color: #fff; 
            margin: 0 0 5px 0; 
            line-height: 1.4;
            /* font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;  */
            /* দীর্ঘ টাইটেল ২ লাইনের পর ডট ডট হবে
            /* -webkit-box-orient: vertical; */
            /* overflow: hidden; */ 
        }

        .meta-line { 
            color: var(--accent); 
            font-size: 0.75rem; 
            opacity: 0.85; 
            /* margin-top: 0;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap; */
        }

        /* মোবাইল ভার্সন ফিক্স */
        @media (max-width: 1024px) {
            .app-container { 
                flex-direction: column;
                /* overflow: auto; */
            }
            .sidebar { 
                width: 100%; 
                min-width: 100%; 
                height: calc(100vh - var(--header-height) - var(--player-height-mobile) - var(--safe-top) - var(--safe-bottom));
                /* padding-bottom: var(--safe-bottom);  */
                /* overflow-y: auto;
                -webkit-overflow-scrolling: touch;  */
                /* স্মুথ স্ক্রলিংয়ের জন্য */                
            }
            .filter-panel { grid-template-columns: repeat(2, 1fr); }
            .player-section { 
                position: fixed; 
                bottom: 0;
                left: 0;
                width: 100%; 
                height: calc(var(--player-height-mobile) + var(--safe-bottom)); 
                z-index: 1000;
                border-top: 2px solid var(--border);
                /* padding-bottom: var(--safe-bottom);  */
                /* নেভিগেশন বারের জন্য জায়গা রাখা */
            }
        }

        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: var(--surface); padding: 25px; border-radius: 12px; width: 260px; text-align: center; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--accent); font-size: 1.2rem;">Smart Class Pro</h2>
        <input type="text" id="username" placeholder="ইউজার নেম" style="width:100%; padding:10px; margin:8px 0; background:#000; border:1px solid var(--border); color:white; border-radius:6px;">
        <input type="password" id="password" placeholder="পাসওয়ার্ড" style="width:100%; padding:10px; margin:8px 0; background:#000; border:1px solid var(--border); color:white; border-radius:6px;">
        <button id="loginBtn" onclick="handleLogin()" style="width:100%; padding:10px; background:var(--accent); border:none; border-radius:6px; font-weight:700; cursor:pointer;">প্রবেশ করুন</button>
        <p id="loginMsg" style="color:#ff4d4d; font-size:0.75rem; margin-top:10px;"></p>
    </div>
</div>

<header>
    <div class="logo">Smart Class Pro</div>
    <div id="userSection" style="display:none; align-items: center; gap: 10px;">
        <span id="displayUserName" style="color:var(--accent); font-size:0.75rem;"></span>
        <button onclick="logout()" style="background:none; color:var(--text-dim); border:1px solid var(--border); padding:4px 8px; border-radius:15px; cursor:pointer; font-size: 0.7rem;">লগআউট</button>
    </div>
</header>

<div class="app-container" id="appMain" style="display: none;">
    <div class="sidebar">
        <div class="filter-panel">
            <select id="classSel" onchange="onFilterChange('class')"><option value="">শ্রেণী</option></select>
            <select id="subSel" onchange="onFilterChange('sub')"><option value="">বিষয়</option></select>
            <select id="lessonSel" onchange="filterData(true)"><option value="">অধ্যায়</option></select>
            <select id="schoolSel" onchange="filterData(true)"><option value="">স্কুল</option></select>
            <select id="yearSel" onchange="filterData(true)"><option value="">বছর</option></select>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="sl-col">নং</th>
                        <th>শ্রেণী</th>
                        <th>বিষয়</th>
                        <th>অধ্যায়</th>
                        <th>টপিক</th>
                        <th>স্কুল</th>
                        <th>বছর</th>
                    </tr>
                </thead>
                <tbody id="videoTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="player-section" id="mainPlayer">        
        <div class="video-wrapper" id="playerWrapper">
            <div style="color:#444; height:100%; display:flex; align-items:center; justify-content:center; font-size: 0.8rem;">ভিডিও নির্বাচন করুন</div>
        </div>
        <div class="playing-info">
            <h2 id="nowPlayingTitle">শিখন শুরু হোক...</h2> 
            <div id="nowPlayingMeta" class="meta-line"></div>           
        </div>
        
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq5UbQRVUA1xv9USzyPmooVRJjAPoIZTOsnuvvnIoYCcvPl17LWChsGZpugvhtMtAt-w/exec';
    let db = [];
    let userIP = "Unknown";

    async function fetchIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            userIP = data.ip;
        } catch (e) { console.log("IP fetch failed"); }
    }

    window.onload = async () => {
        await fetchIP();
        if(localStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('displayUserName').innerText = localStorage.getItem('user');
            initApp();
        }
    };

    if (window.innerWidth <= 1024) {
        document.getElementById('mainPlayer').scrollIntoView({ behavior: 'smooth' });
    }

    async function sendLog(logType, detail = "") {
        const user = localStorage.getItem('user') || 'Unknown';
        const isMobile = navigator.userAgent.includes("Mobi");
        const device = isMobile ? "Mobile" : "Desktop";
        const params = new URLSearchParams({ type: 'log', user: user, logType: logType, device: device, ip: userIP, detail: detail });
        try { await fetch(`${SCRIPT_URL}?${params.toString()}&_=${Date.now()}`, { mode: 'no-cors' }); } catch(e) {}
    }

    async function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const msg = document.getElementById('loginMsg');
        if(!u || !p) { msg.innerText = "সব ঘর পূরণ করুন"; return; }
        msg.innerText = "যাচাই হচ্ছে...";
        try {
            const res = await fetch(`${SCRIPT_URL}?type=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
            const data = await res.json();
            if(data.status === "success") {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user', data.username);
                await sendLog("Login Success", "ড্যাশবোর্ড প্রবেশ");
                location.reload();
            } else { msg.innerText = "ভুল ইউজার বা পাসওয়ার্ড!"; }
        } catch(e) { msg.innerText = "সার্ভার এরর!"; }
    }

    // লগআউট ফাংশন আপডেট করা হয়েছে
    async function logout() {
        await sendLog("Logout", "ইউজার সেশন শেষ করেছেন");
        localStorage.clear(); 
        location.reload();
    }

    function initApp() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appMain').style.display = 'flex';
        document.getElementById('userSection').style.display = 'flex';
        loadData();
    }

    async function loadData() {
        try {
            const res = await fetch(`${SCRIPT_URL}?_=${Date.now()}`);
            db = await res.json();
            populateDropdown('classSel', [...new Set(db.map(i => i.class))]);
            // স্কুল ও বছরের অপশনগুলোও পপুলেট করে রাখা
            populateDropdown('schoolSel', [...new Set(db.map(i => i.school))]);
            populateDropdown('yearSel', [...new Set(db.map(i => i.year))]);
            
            restoreSession();
            filterData(false);
            const last = JSON.parse(localStorage.getItem('lastVideo') || 'null');
            if(last) playVideo(last, true);
        } catch(e) { console.log("Data load error"); }
    }

    function populateDropdown(id, options, selectedValue = "") {
        const sel = document.getElementById(id);
        const defaultText = sel.options[0].text;
        sel.innerHTML = `<option value="">${defaultText}</option>`;
        [...new Set(options)].sort().forEach(o => {
            if(o) {
                const opt = new Option(o, o);
                if(o === selectedValue) opt.selected = true;
                sel.add(opt);
            }
        });
    }

    function onFilterChange(type) {
        const classVal = document.getElementById('classSel').value;
        const subVal = document.getElementById('subSel').value;

        if (type === 'class') {
            const filteredSubs = db.filter(i => i.class === classVal).map(i => i.sub);
            populateDropdown('subSel', filteredSubs);
            populateDropdown('lessonSel', []); 
        } else if (type === 'sub') {
            const filteredLessons = db.filter(i => i.class === classVal && i.sub === subVal).map(i => i.lesson);
            populateDropdown('lessonSel', filteredLessons);
        }
        filterData(true);
    }

    function restoreSession() {
        const f = JSON.parse(localStorage.getItem('lastFilters') || '{}');
        if(f.class) {
            document.getElementById('classSel').value = f.class;
            const subs = db.filter(i => i.class === f.class).map(i => i.sub);
            populateDropdown('subSel', subs, f.sub);
            if(f.sub) {
                const lessons = db.filter(i => i.class === f.class && i.sub === f.sub).map(i => i.lesson);
                populateDropdown('lessonSel', lessons, f.lesson);
            }
        }
        if(f.school) document.getElementById('schoolSel').value = f.school;
        if(f.year) document.getElementById('yearSel').value = f.year;
    }

    function filterData(shouldLog = true) {
        const f = {
            class: document.getElementById('classSel').value,
            sub: document.getElementById('subSel').value,
            lesson: document.getElementById('lessonSel').value,
            school: document.getElementById('schoolSel').value,
            year: document.getElementById('yearSel').value
        };
        localStorage.setItem('lastFilters', JSON.stringify(f));

        const filtered = db.filter(i => 
            (!f.class || i.class == f.class) && (!f.sub || i.sub == f.sub) &&
            (!f.lesson || i.lesson == f.lesson) && (!f.school || i.school == f.school) &&
            (!f.year || i.year == f.year)
        );
        
        const body = document.getElementById('videoTableBody');
        body.innerHTML = "";
        const lastVid = JSON.parse(localStorage.getItem('lastVideo') || '{}');

        const loadingBar = document.getElementById('loadingBar');
        
        body.innerHTML = ""; // আগের ডাটা ক্লিয়ার
        
        // Chunk Rendering: ডাটা অল্প অল্প করে রেন্ডার হবে যেন ব্রাউজার ফ্রিজ না হয়
        let index = 0;
        const chunkSize = 200; // একবারে ২০০টি রো তৈরি হবে


        function renderChunk() {
            const fragment = document.createDocumentFragment();
            const end = Math.min(index + chunkSize, filtered.length);
            
            for (; index < end; index++) {
                const item = filtered[index];
                const row = document.createElement('tr');
                const toBanglaNum = (n) => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
                if(lastVid.url === item.url) row.classList.add('active-row');
                
                row.innerHTML = `
                    <td class="sl-col">${toBanglaNum(index + 1)}</td>
                    <td>${item.class||'-'}</td>
                    <td>${item.sub||'-'}</td>
                    <td>${item.lesson||'-'}</td>
                    <td class="topic-cell">${item.topic||'-'}</td>
                    <td>${item.school||'-'}</td>
                    <td>${item.year||'-'}</td>
                `;
                row.onclick = () => playVideo(item);
                fragment.appendChild(row);
            }
            
            body.appendChild(fragment);
            
            // প্রগ্রেস বার আপডেট
            const progress = (index / filtered.length) * 100;
            loadingBar.style.width = progress + "%";

            if (index < filtered.length) {
                requestAnimationFrame(renderChunk); // পরবর্তী অংশ রেন্ডার করবে
            } else {
                setTimeout(() => loadingBar.style.width = "0%", 500);
            }
        }

        renderChunk();

        if(shouldLog) {
            sendLog("Filter Action", `ফলাফল: ${filtered.length}টি ভিডিও`);
        }
    }      

    function playVideo(item, isRestore = false) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const m = item.url.match(reg);
        const ytId = (m && m[2].length === 11) ? m[2] : null;
        if(!ytId) return;

        localStorage.setItem('lastVideo', JSON.stringify(item));
        const embedUrl = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=${isRestore?0:1}&enablejsapi=1`;
        document.getElementById('playerWrapper').innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        document.getElementById('nowPlayingTitle').innerText = item.topic;
        document.getElementById('nowPlayingMeta').innerText = `${item.class || '-'} | ${item.sub || '-'} | ${item.lesson || '-'} | ${item.school || '-'}`;

        if(!isRestore) {
            const logDetail = `প্লে: [${item.class||'-'}] [${item.sub||'-'}] [${item.lesson||'-'}] [${item.topic||'-'}] [${item.year||'-'}] (স্কুল: ${item.school||'-'})`;
            sendLog("Watch Video", logDetail);
        }
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        filterData(false); 
    }
</script>
</body>
</html>
